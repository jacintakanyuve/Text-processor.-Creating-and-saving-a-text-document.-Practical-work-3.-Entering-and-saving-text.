<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Информатика 3 класс: Текстовый процессор</title>
  <style>
    :root {
      --bg: #f0fdfa;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --primary-light: #e0f2fe;
      --accent: #f59e0b;
      --accent-light: #fef3c7;
      --success: #10b981;
      --success-light: #d1fae5;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --radius: 16px;
      --shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Comic Sans MS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
      font-size: 1.05rem;
    }

    /* Навигация и прогресс-бар */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
    }
    .topbar-inner { max-width: 800px; margin: 0 auto; }
    .topbar-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    
    .badge {
      background: var(--primary-light); color: var(--primary-dark);
      font-weight: 700; font-size: 0.9rem; padding: 6px 14px; border-radius: 999px;
      border: 2px solid #bae6fd;
    }
    .timer-box {
      font-size: 0.9rem; font-weight: 700; color: var(--text-muted);
      background: var(--surface-soft); padding: 6px 14px;
      border-radius: 999px; border: 2px solid var(--border);
    }
    .progress-track { width: 100%; height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--success)); transition: width 0.4s ease; }
    
    .nav-pills { display: flex; gap: 8px; overflow-x: auto; padding-top: 12px; scrollbar-width: none; }
    .nav-pills::-webkit-scrollbar { display: none; }
    .nav-pill {
      border: 2px solid var(--border); background: var(--surface); color: var(--text-muted);
      padding: 8px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .nav-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
